game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []
# The C runtime's setjmp/longjmp (MS CRT layout: f14-f31 at 0, r1 at 144, r13.. from 152 as std).
# Found 2026-10-30 by matching Prey's pair (0x822ECC00 / 0x822EC9B0, itself matched from DOA4's)
# over 24 instructions with immediates and branch targets masked: one hit each in this image.
# The image carries libpng and libjpeg, whose error exits longjmp. Named here, codegen emits
# ppc_setjmp/ppc_longjmp instead of translating the stack games.
setjmp_address = 0x82099830
longjmp_address = 0x82099600

[entrypoint.functions]
# Round 1 (2026-10-30): the scaffold. Nothing yet: the first codegen run (after the user's OK,
# docs/HANDOFF.md) says whether this image needs any hint; then tools/find_missed_functions.py,
# tools/find_code_pointers.py and tools/check_switch_tables.py on the decrypted image.

# The game's own frame rate and the RenderDoc capture trigger (src/frame_timing.cpp): just before
# its one call to VdSwap (the import thunk at 0x820E2504), the only `bl` to it in .text, at
# 0x82032A1C (found 2026-10-30 by scanning the decrypted image for branches to the thunk).
[[entrypoint.midasm_hook]]
name = "GeomWarsFrameMark"
address = 0x82032A1C
registers = []
