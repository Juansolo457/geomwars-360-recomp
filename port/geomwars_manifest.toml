# Geometry Wars: Retro Evolved (Xbox 360, Xbox Live Arcade), the LIVE package 584107ED:
# default.xex v0.0.1.1, title 584107ED, built 2005-11-02,
# SHA-256 33ae21996edb93478d5eef4f58ae0bec5f5411d3b6a7103a2141bd9f6154ff45 (tools/build.ps1 checks it).
# Scaffold as `rexglue init` writes it (ReXGlue v0.10.0.24-dev.gbd833a2). Function hints go below
# in rounds, each with a comment saying where it came from (codegen warnings,
# tools/find_missed_functions.py, tools/check_switch_tables.py, tools/find_code_pointers.py,
# tools/find_vcall_thunks.py). Fix missing functions here, never in the generated code.

[project]
name = "geomwars"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []
# The C runtime's setjmp/longjmp (MS CRT layout: f14-f31 at 0, r1 at 144, r13.. from 152 as std).
# Found 2026-10-30 by matching Prey's pair (0x822ECC00 / 0x822EC9B0, itself matched from DOA4's)
# over 24 instructions with immediates and branch targets masked: one hit each in this image.
# The image carries libpng and libjpeg, whose error exits longjmp. Named here, codegen emits
# ppc_setjmp/ppc_longjmp instead of translating the stack games.
setjmp_address = 0x82099830
longjmp_address = 0x82099600

[entrypoint.functions]
# Round 1 (2026-10-30): the first codegen run's one error, "b 0x82075438 from 0x8207D764 -
# target not in any function": a leaf reached by a tail branch with no .pdata entry (the sister
# images each needed one to three of these).
0x82075438 = {}  # codegen UnresolvedCall, tail branch from 0x8207D764

