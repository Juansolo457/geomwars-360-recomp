# The game's own frame rate and the RenderDoc capture trigger (src/frame_timing.cpp): just before
# its one call to VdSwap (the import thunk at 0x820E2504), the only `bl` to it in .text, at
# 0x82032A1C (found 2026-10-30 by scanning the decrypted image for branches to the thunk).
[[entrypoint.midasm_hook]]
name = "GeomWarsFrameMark"
address = 0x82032A1C
registers = []

# The FPSCR guard (src/fpscr_guard.cpp): run 1 (2026-10-30) died at +2 s with C000008F on the
# audio worker (MXCSR 0x20, the game's mixer sub_820B33E8 under the render-driver callback
# sub_82081578, the outermost guest function on that thread in the crash report). Hooked at the
# callback's entry and before each of the image's four mtfsf (the C runtime's floating-point
# environment functions, FINDINGS.md), as DOA4 and Quake 4 did.
[[entrypoint.midasm_hook]]   # the audio render-driver callback, entered on an unseeded context
name = "GeomWarsGuardFpscr"
address = 0x82081578
registers = []

